name: Build SENDA.V0 Windows Desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller openpyxl xlsxwriter xlrd pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Bundle 7-Zip for RAR
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/7zip | Out-Null
          Copy-Item 'C:\Program Files\7-Zip\7z.exe' tools/7zip/7z.exe -Force
          Copy-Item 'C:\Program Files\7-Zip\7z.dll' tools/7zip/7z.dll -Force
      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name SENDA.V0 --icon assets/senda_v0.ico `
            --add-data "assets;assets" --add-data "vendor;vendor" --add-data "tools;tools" `
            --hidden-import openpyxl --hidden-import xlsxwriter --hidden-import xlrd `
            SENDA_V0_DESKTOP.pyw
      - name: Assemble installer folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item -Recurse dist/SENDA.V0 release/SENDA.V0
          New-Item -ItemType Directory -Force release/SENDA.V0/scripts | Out-Null
          Copy-Item scripts/install_desktop.ps1 release/SENDA.V0/scripts/
          Copy-Item scripts/update_desktop.ps1 release/SENDA.V0/scripts/
          Copy-Item scripts/uninstall_desktop.ps1 release/SENDA.V0/scripts/
          Copy-Item INSTALAR_SENDA_V0.bat release/SENDA.V0/
          Copy-Item ACTUALIZAR_SENDA_V0.bat release/SENDA.V0/
          Copy-Item DESINSTALAR_SENDA_V0.bat release/SENDA.V0/
          Copy-Item MANTENIMIENTO_SENDA_V0.bat release/SENDA.V0/
          Compress-Archive -Path release/SENDA.V0/* -DestinationPath SENDA.V0_0.4.0_WINDOWS_DESKTOP.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SENDA.V0-0.4.0-Windows-Desktop
          path: SENDA.V0_0.4.0_WINDOWS_DESKTOP.zip
